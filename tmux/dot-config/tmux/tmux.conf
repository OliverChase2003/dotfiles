# set colors
set -g default-terminal 'tmux-256color'
set -sg terminal-overrides ',*:RGB'
set -gq allow-passthrough on
# enable mouse
set -g mouse on
# enable clipboard
set -g set-clipboard on
# extended keys
set -g extended-keys on
set -g extended-keys-format csi-u
# send focus event to apps in tmux
set -g focus-events on

# windows
set -g base-index 1
set -g renumber-windows on
set -g window-style "bg=#1E1E2E"
set -g window-active-style "bg=#1E1E2E"

# pane
set -g pane-base-index 1
set -g pane-border-style 'fg=#1E1E2E'
set -g pane-active-border-style 'fg=#CBA6F7'

# status bar
set -g status-interval 1
set -g status-position bottom
set -g status-bg "#1E1E2E"
set -g status-fg white
set -g @prefix_highlight_show_prefix on
set -g status-left ""
set -g status-right "\
	#[fg=#CBA6F7] %Y-%m-%d |\
	#[fg=#CBA6F7] %H:%M |\
	#{?client_prefix,	#[fg=#CBA6F7] [PREFIX] ,\
						#[fg=#876FA5]  PREFIX  }\
"
set -g window-status-current-format "\
	#[bg=#CBA6F7,fg=#313244,bold] #I \
	#[bg=#1E1E2E,fg=#CDD6F4] #W \
"
set -g window-status-format "\
	#[bg=#876FA5,fg=#313244] #I \
	#[bg=#1E1E2E,fg=#A5ADCB] #W \
"

# keymaps
# prefix
set -g prefix None
unbind C-b
bind-key -n C-Space run-shell -b \
	"$HOME/.config/tmux/scripts/im.sh switch us" \; \
	switch-client -T prefix

# window
bind . next-window
bind -r > next-window
bind , previous-window
bind -r < previous-window
bind a new-window -a
bind n new-window -a
bind A new-window
bind i new-window -b
bind I new-window -b -t 1
bind N new-window -a -c "#{pane_current_path}"
bind x kill-window
bind y copy-mode

# pane
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H select-pane -L
bind -r J select-pane -D
bind -r K select-pane -U
bind -r L select-pane -R
bind v split-window -v -c "#{pane_current_path}"
bind c split-window -h -c "#{pane_current_path}"
bind d kill-pane

# reload config
bind r source-file ~/.config/tmux/tmux.conf

# yank mode(require wl-clipboard package in wayland)
## normal mode --y--> yank mode -C-v-> select block --y--> yank
## normal mode --y--> yank mode -S-v-> select line --y--> yank
bind -T copy-mode-vi C-v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy" # yank to clipboard
