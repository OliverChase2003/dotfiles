patch:
  # 已移除反引号与斜杠：` / 不再进入编码，作为普通半角符号直接上屏
  speller:
    alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA›
    initials: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA›
    delimiter: " '"        # 系统配置，第一位<空格>是拼音之间的分隔符；第二位<'>表示可以手动输入单引号来分割拼音。
    visual_delimiter: " "  # super_preedit.lua配置：是否让分隔符号跟着一起转换，例如nǐ'hǎo 在实际使用中表现出视觉拥挤，我们可以让delimiter平时是'转换为拼音的时候使用空格nǐ hǎo，更符合实际。
    tone_isolate: true     # super_preedit.lua配置：是否将数字声调从转换后拼音中隔离出来（true=隔离， false 直接参与转换）例如：nǐ3
    algebra:
      __patch:
        - wanxiang_algebra:/base/自然码     # 拼音转双拼码

  # 关闭反查（拆字/笔画）：该 pattern 永不匹配，输入中不会再产生 wanxiang_reverse 段落
  recognizer/patterns/wanxiang_reverse: "^(?!)$"

  # ` 直接上屏为半角反引号（其余标点保持 wanxiang_symbols 原表不变）
  "punctuator/half_shape/`": {commit: '`'}

  key_binder:
    bindings:
      # 翻页 , .
      - { when: has_menu, accept: comma, send: Page_Up }
      - { when: has_menu, accept: period, send: Page_Down }
      # Shift 在输入时相当于回车（上屏但不切换中英）
      - { when: composing, accept: Shift_L, send: Return }
      - { when: composing, accept: Shift_R, send: Return }
      # Tab / Shift+Tab 切换光标至下/上一个拼音
      - { when: composing, accept: Shift+Tab, send: Shift+Left }
      - { when: composing, accept: Tab, send: Shift+Right }
